{% extends "base.html" %}
{% block content %}
<style>
/* Animação da linha de laser do Scanner */
@keyframes scanAnimation {
    0% { top: 0%; opacity: 0.8; }
    50% { opacity: 1; }
    100% { top: 95%; opacity: 0.8; }
}
.scan-line {
    position: absolute;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, rgba(59,130,246,0) 0%, rgba(59,130,246,1) 50%, rgba(59,130,246,0) 100%);
    box-shadow: 0 0 15px 3px rgba(59, 130, 246, 0.8);
    animation: scanAnimation 2s infinite ease-in-out;
}
</style>

<div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <h2 class="text-xl font-bold text-gray-800 mb-2">Capturar Atestado via Câmera</h2>
        <p class="text-sm text-gray-500 mb-4">Posicione o atestado em frente à câmera e clique em "Tirar Foto e Processar OCR".</p>

        <!-- Câmera ao vivo e Overlay de Animação -->
        <div class="flex flex-col items-center gap-4">
            <div class="relative w-full max-w-md bg-black rounded-lg overflow-hidden aspect-video flex items-center justify-center border-2 border-slate-700">
                <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="canvas" class="hidden"></canvas>
                
                <!-- Overlay de Animação do Scanner (Escondido por padrão) -->
                <div id="scannerOverlay" class="hidden absolute inset-0 bg-blue-900/20 backdrop-blur-[1px] flex flex-col justify-between">
                    <div class="scan-line"></div>
                    <div class="bg-black/60 text-blue-400 text-xs font-bold py-1 px-3 text-center tracking-wider">
                        <i class="fa-solid fa-spinner fa-spin mr-1"></i> ESCANEANDO DOCUMENTO...
                    </div>
                </div>
            </div>

            <div class="flex flex-wrap gap-3 w-full justify-center">
                <button id="btnLigarCam" type="button" onclick="iniciarCamera()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-md font-semibold text-sm transition">
                    <i class="fa-solid fa-video mr-1"></i> Ligar Câmera
                </button>
                <button id="btnCapturar" type="button" onclick="capturarEProcessar()" disabled class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white px-6 py-2 rounded-md font-semibold text-sm transition">
                    <i class="fa-solid fa-camera mr-1"></i> Tirar Foto e Processar OCR
                </button>
            </div>
            
            <p class="text-xs text-gray-400">Ou envie um arquivo do computador:</p>
            <input type="file" id="fileInput" accept="image/*" onchange="processarArquivo(this)" class="block text-xs text-gray-500 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>
    </div>

    <!-- Formulário de Validação Manual / Pós-OCR -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Dados Extraídos (Conferência do RH)</h3>
        
        <form action="/salvar-atestado" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="hidden" name="caminho_imagem" id="caminho_imagem">

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nome do Colaborador</label>
                <input type="text" name="colaborador" id="colaborador" required placeholder="Digite o nome..." class="w-full border rounded-md p-2 text-sm border-gray-300">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Loja / Unidade</label>
                <select name="loja" required class="w-full border rounded-md p-2 text-sm border-gray-300">
                    <option value="Loja 01 - Centro">Loja 01 - Centro</option>
                    <option value="Loja 02 - Shopping">Loja 02 - Shopping</option>
                    <option value="Matriz - Depósito">Matriz - Depósito</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Setor</label>
                <select name="setor" required class="w-full border rounded-md p-2 text-sm border-gray-300">
                    <option value="Vendas">Vendas</option>
                    <option value="Caixa">Caixa</option>
                    <option value="Logística">Logística</option>
                    <option value="Administrativo">Administrativo</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Médico Emitente</label>
                <input type="text" name="medico" id="medico" class="w-full border rounded-md p-2 text-sm border-gray-300">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">CRM e UF</label>
                <input type="text" name="crm" id="crm" class="w-full border rounded-md p-2 text-sm border-gray-300">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">CID-10</label>
                <input type="text" name="cid" id="cid" required class="w-full border rounded-md p-2 text-sm border-gray-300">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">CNPJ do Hospital/Clínica</label>
                <input type="text" name="cnpj" id="cnpj" class="w-full border rounded-md p-2 text-sm border-gray-300">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Dias de Afastamento</label>
                <input type="number" name="dias_afastamento" id="dias_afastamento" required min="1" class="w-full border rounded-md p-2 text-sm border-gray-300">
            </div>

            <div class="md:col-span-2 mt-4">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md text-sm transition">
                    Confirmar e Salvar Atestado
                </button>
            </div>
        </form>
    </div>
</div>

<script>
async function iniciarCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('webcam');
        video.srcObject = stream;
        document.getElementById('btnCapturar').disabled = false;
    } catch (err) {
        alert("Não foi possível acessar a câmera. Verifique se o navegador deu permissão.");
    }
}

async function capturarEProcessar() {
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');

    if (!video.videoWidth) {
        alert("Ligue a câmera primeiro antes de tirar a foto.");
        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append('file', blob, 'captura_camera.jpg');
        await enviarParaOCR(formData);
    }, 'image/jpeg');
}

async function processarArquivo(input) {
    if (!input.files[0]) return;
    const formData = new FormData();
    formData.append('file', input.files[0]);
    await enviarParaOCR(formData);
}

async function enviarParaOCR(formData) {
    const btn = document.getElementById('btnCapturar');
    const overlay = document.getElementById('scannerOverlay');
    
    // Ativa animação do scanner
    overlay.classList.remove('hidden');
    btn.disabled = true;

    try {
        const response = await fetch('/processar-ocr', { method: 'POST', body: formData });
        const data = await response.json();

        // Preenche o formulário com o resultado do OCR
        document.getElementById('medico').value = data.medico || '';
        document.getElementById('crm').value = data.crm || '';
        document.getElementById('cid').value = data.cid || '';
        document.getElementById('cnpj').value = data.cnpj || '';
        document.getElementById('dias_afastamento').value = data.dias_afastamento || 1;
        document.getElementById('caminho_imagem').value = data.caminho_imagem || '';

        // Se o nome do colaborador estiver vazio, coloca um nome fictício para facilitar
        if (!document.getElementById('colaborador').value) {
            document.getElementById('colaborador').value = 'Colaborador de Teste';
        }
    } catch (err) {
        alert('Erro ao enviar imagem.');
    } finally {
        // Desativa a animação do scanner após 1.5s
        setTimeout(() => {
            overlay.classList.add('hidden');
            btn.disabled = false;
        }, 1200);
    }
}
</script>
{% endblock %}

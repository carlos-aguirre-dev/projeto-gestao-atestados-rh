<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Atestados</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">RH Analytics</h1>
            <p class="text-xs text-slate-500">Gestão Inteligente de Atestados</p>
        </div>

        <form action="/scanner" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">E-mail / Matrícula</label>
                <input type="text" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:outline-none focus:border-blue-500" placeholder="usuario@empresa.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Senha</label>
                <input type="password" required class="w-full border border-gray-300 rounded-md p-2 text-sm focus:outline-none focus:border-blue-500" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-md text-sm transition">
                Entrar no Sistema
            </button>
        </form>
    </div>
</body>
</html>
